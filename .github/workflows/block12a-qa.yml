name: BLOQUE 12A · QA móvil efímero

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block12a-qa
  cancel-in-progress: true

env:
  QA_DATABASE_URL: postgres://rango90:rango90-qa@127.0.0.1:55432/rango90_qa_block12
  QA_DB_CONTAINER: rango90-block12a-postgres
  QA_ARTIFACT_DIR: block12a-artifacts
  QA_FRONTEND_URL: http://127.0.0.1:3000
  QA_BACKEND_URL: http://127.0.0.1:4000

jobs:
  isolated-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend and QA dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start temporary PostgreSQL
        continue-on-error: true
        run: |
          docker rm -f "$QA_DB_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --name "$QA_DB_CONTAINER" \
            --publish 55432:5432 \
            --env POSTGRES_DB=rango90_qa_block12 \
            --env POSTGRES_USER=rango90 \
            --env POSTGRES_PASSWORD=rango90-qa \
            postgres:16
          for attempt in $(seq 1 30); do
            if docker exec "$QA_DB_CONTAINER" pg_isready -U rango90 -d rango90_qa_block12 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Apply migrations to the isolated database
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          NODE_ENV: test
          RANGO90_RUNTIME_MODE: lab
        run: npm run migrate

      - name: Seed only Block 12A fixtures
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          NODE_ENV: test
          RANGO90_RUNTIME_MODE: lab
          BLOCK12_QA_RUN_ID: ${{ github.run_id }}
        run: npx tsx src/qa/block12a-fixture.ts seed

      - name: Build backend and static frontend
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.QA_BACKEND_URL }}
        run: |
          npm run build
          npm --prefix backend run build

      - name: Run lab backend and mobile browser audit
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          NODE_ENV: test
          RANGO90_RUNTIME_MODE: lab
          PORT: 4000
          CORS_ORIGIN: ${{ env.QA_FRONTEND_URL }}
          AUTH_FRONTEND_ORIGIN: ${{ env.QA_FRONTEND_URL }}/es/
          NEXT_PUBLIC_API_BASE_URL: ${{ env.QA_BACKEND_URL }}
        run: |
          mkdir -p "$QA_ARTIFACT_DIR/lab"
          nohup node backend/dist/server.js >"$QA_ARTIFACT_DIR/lab/backend.log" 2>&1 &
          echo $! >"$QA_ARTIFACT_DIR/lab/backend.pid"
          nohup python3 -m http.server 3000 --directory out >"$QA_ARTIFACT_DIR/lab/frontend.log" 2>&1 &
          echo $! >"$QA_ARTIFACT_DIR/lab/frontend.pid"
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused "$QA_BACKEND_URL/health" >"$QA_ARTIFACT_DIR/lab/health.json"
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused "$QA_FRONTEND_URL/es/" >/dev/null
          QA_PHASE=lab QA_TIMEOUT_SECONDS=62 npm run qa:block12a:mobile

      - name: Stop lab services and run official-mode checks
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          NODE_ENV: test
          RANGO90_RUNTIME_MODE: official
          PORT: 4000
          CORS_ORIGIN: ${{ env.QA_FRONTEND_URL }}
          AUTH_FRONTEND_ORIGIN: ${{ env.QA_FRONTEND_URL }}/es/
        run: |
          if [ -f "$QA_ARTIFACT_DIR/lab/backend.pid" ]; then kill "$(cat "$QA_ARTIFACT_DIR/lab/backend.pid")" >/dev/null 2>&1 || true; fi
          if [ -f "$QA_ARTIFACT_DIR/lab/frontend.pid" ]; then kill "$(cat "$QA_ARTIFACT_DIR/lab/frontend.pid")" >/dev/null 2>&1 || true; fi
          mkdir -p "$QA_ARTIFACT_DIR/official"
          nohup node backend/dist/server.js >"$QA_ARTIFACT_DIR/official/backend.log" 2>&1 &
          echo $! >"$QA_ARTIFACT_DIR/official/backend.pid"
          nohup python3 -m http.server 3000 --directory out >"$QA_ARTIFACT_DIR/official/frontend.log" 2>&1 &
          echo $! >"$QA_ARTIFACT_DIR/official/frontend.pid"
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused "$QA_BACKEND_URL/health" >"$QA_ARTIFACT_DIR/official/health.json"
          code=$(curl --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused -o "$QA_ARTIFACT_DIR/official/challenge.json" -w '%{http_code}' "$QA_BACKEND_URL/v1/challenges/daily")
          echo "$code" >"$QA_ARTIFACT_DIR/official/challenge.status"
          test "$code" = 503
          grep -q 'official_not_ready' "$QA_ARTIFACT_DIR/official/challenge.json"
          curl --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused "$QA_FRONTEND_URL/es/" >/dev/null
          QA_PHASE=official npm run qa:block12a:mobile

      - name: Clean fixtures and stop all ephemeral services
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          NODE_ENV: test
          RANGO90_RUNTIME_MODE: lab
          BLOCK12_QA_RUN_ID: ${{ github.run_id }}
        run: |
          npx tsx src/qa/block12a-fixture.ts cleanup >"../$QA_ARTIFACT_DIR/cleanup.json" 2>&1 || true
          for pid_file in "../$QA_ARTIFACT_DIR/lab/backend.pid" "../$QA_ARTIFACT_DIR/lab/frontend.pid" "../$QA_ARTIFACT_DIR/official/backend.pid" "../$QA_ARTIFACT_DIR/official/frontend.pid"; do
            if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" >/dev/null 2>&1 || true; fi
          done
          docker rm -f "$QA_DB_CONTAINER" >/dev/null 2>&1 || true

      - name: Verify passed/failed/not_run reports
        if: always()
        run: node scripts/verify-block12a-report.mjs

      - name: Upload Block 12A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block12a-qa-evidence-${{ github.run_id }}
          path: block12a-artifacts
          if-no-files-found: warn
          retention-days: 14
