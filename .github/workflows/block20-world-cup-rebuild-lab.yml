name: BLOQUE 20 · reconstrucción real Mundial en lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-cup-rebuild-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RANGO90_RUNTIME_MODE: lab
      NODE_ENV: test
      DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55445/rango90_qa_block20_runtime
      RANGO90_ISOLATED_DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55445/rango90_qa_block20
      BLOCK20_OUTPUT_ROOT: ${{ github.workspace }}/.block20-output
      BLOCK20_INPUT_ROOT: ${{ github.workspace }}/.block20-output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
      - name: Build frontend and backend
        run: |
          npm run build
          npm --prefix backend run build
      - name: Plan API-Football coverage without storing the key
        working-directory: backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npx tsx src/tools/block19-api-football-plan.ts | tee "$GITHUB_WORKSPACE/.block20-api-plan.json"
      - name: Build real facts from World Cup match files
        working-directory: backend
        run: npx tsx src/tools/block20-rebuild-world-cup.ts
      - name: Start temporary PostgreSQL
        run: |
          docker run -d --name rango90-block20-postgres -e POSTGRES_DB=rango90_qa_block20 -e POSTGRES_USER=rango90 -e POSTGRES_PASSWORD=rango90-qa -p 55445:5432 postgres:16
          for attempt in $(seq 1 40); do
            docker exec rango90-block20-postgres pg_isready -U rango90 -d rango90_qa_block20 >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rango90-block20-postgres pg_isready -U rango90 -d rango90_qa_block20
      - name: Apply migrations to isolated PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.RANGO90_ISOLATED_DATABASE_URL }}
        run: npm run migrate
      - name: Load real facts and candidate snapshots
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.RANGO90_ISOLATED_DATABASE_URL }}
        run: npx tsx src/tools/block20-load-lab-candidate.ts | tee "$GITHUB_WORKSPACE/.block20-load.json"
      - name: Repeat load to prove idempotency
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.RANGO90_ISOLATED_DATABASE_URL }}
        run: npx tsx src/tools/block20-load-lab-candidate.ts | tee "$GITHUB_WORKSPACE/.block20-load-rerun.json"
      - name: Verify real ranking, provenance, rollback and official guard
        working-directory: backend
        env:
          RANGO90_ISOLATED_DATABASE_URL: ${{ env.RANGO90_ISOLATED_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx tsx src/tests/block20-world-cup-ranking.integration.test.ts | tee "$GITHUB_WORKSPACE/.block20-integration.json"
      - name: Verify no key, payload or publication artifact was emitted
        run: |
          ! grep -REn 'API_FOOTBALL_KEY|x-apisports-key|"apiKey"[[:space:]]*:|published[^\n]*true|official[^\n]*opened' .block20-output .block20-api-plan.json .block20-load.json .block20-load-rerun.json .block20-integration.json
      - name: Cleanup PostgreSQL and temporary facts
        if: always()
        run: docker rm -f rango90-block20-postgres >/dev/null 2>&1 || true
      - name: Upload redacted Block 20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block20-world-cup-rebuild-lab-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/.block20-api-plan.json
            ${{ github.workspace }}/.block20-load.json
            ${{ github.workspace }}/.block20-load-rerun.json
            ${{ github.workspace }}/.block20-integration.json
            ${{ github.workspace }}/.block20-output/BLOCK20_REPORT.json
            ${{ github.workspace }}/.block20-output/BLOCK20_REPORT.md
            ${{ github.workspace }}/.block20-output/BLOCK20_SNAPSHOTS.json
