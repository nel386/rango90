name: BLOQUE 26 · asistencias históricas Champions en lab

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: block26-champions-assists
  cancel-in-progress: true

jobs:
  isolated-assists-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RANGO90_RUNTIME_MODE: lab
      NODE_ENV: test
      DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55449/rango90_qa_block26
      RANGO90_ISOLATED_DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55449/rango90_qa_block26
      API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BLOCK26_ACTIVE_SEASON_START: '2026'
      BLOCK26_ACTIVE_COVERAGE_COMPLETE: 'false'
      BLOCK26_OUTPUT_ROOT: ${{ runner.temp }}/block26
      BLOCK26_ACTIVE_FACTS_FILE: ${{ runner.temp }}/block26/BLOCK26_API_ASSISTS_FACTS.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm --prefix backend ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Start temporary PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name rango90-block26-postgres -e POSTGRES_DB=rango90_qa_block26 -e POSTGRES_USER=rango90 -e POSTGRES_PASSWORD=rango90-qa -p 55449:5432 postgres:16
          for attempt in $(seq 1 40); do
            docker exec rango90-block26-postgres pg_isready -U rango90 -d rango90_qa_block26 >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rango90-block26-postgres pg_isready -U rango90 -d rango90_qa_block26
      - name: Apply migrations to isolated PostgreSQL
        working-directory: backend
        run: npm run migrate
      - name: Fetch active-season assist facts without storing payloads
        working-directory: backend
        run: npm run block26:fetch
      - name: Load candidates and build isolated snapshots
        if: always()
        working-directory: backend
        run: npm run block26:load
      - name: Run engine tests and isolated endpoint comparison
        if: always()
        working-directory: backend
        run: |
          npm run test:champions-assists
          npm run test:block26:integration
      - name: Verify redaction and official guard
        if: always()
        run: |
          set -euo pipefail
          if rg -n 'API_FOOTBALL_KEY|x-apisports-key|Authorization:|Bearer |"response"\s*:' "$BLOCK26_OUTPUT_ROOT" 2>/dev/null; then exit 1; fi
          if rg -n '"published"\s*:\s*true|"officialModeOpened"\s*:\s*true|"officialSnapshotCreated"\s*:\s*true' "$BLOCK26_OUTPUT_ROOT" 2>/dev/null; then exit 1; fi
      - name: Cleanup PostgreSQL and temporary artifacts
        if: always()
        run: |
          docker rm -f rango90-block26-postgres >/dev/null 2>&1 || true
      - name: Upload redacted Block 26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block26-champions-assists-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/block26/BLOCK26_REPORT.json
            ${{ runner.temp }}/block26/BLOCK26_REPORT.md
            ${{ runner.temp }}/block26/BLOCK26_HISTORICAL_SNAPSHOT_CANDIDATE.json
            ${{ runner.temp }}/block26/BLOCK26_ACTIVE_SNAPSHOT_CANDIDATE.json
            ${{ runner.temp }}/block26/BLOCK26_ACTIVE_CHANGES.json
            ${{ runner.temp }}/block26/BLOCK26_ROLLBACK.json
            ${{ runner.temp }}/block26/BLOCK26_FACTS_AFTER.json
            ${{ runner.temp }}/block26/BLOCK26_COVERAGE_MATRIX.json
            ${{ runner.temp }}/block26/BLOCK26_API_ASSISTS_REPORT.json
            ${{ runner.temp }}/block26/BLOCK26_API_ASSISTS_REPORT.md
      - name: Remove temporary candidate files
        if: always()
        run: rm -rf "$BLOCK26_OUTPUT_ROOT"
