name: BLOQUE 28 · cobertura real asistencias Champions 2011-2025

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block28-champions-assists-coverage
  cancel-in-progress: true

jobs:
  champions-assists-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RANGO90_RUNTIME_MODE: lab
      NODE_ENV: test
      DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55453/rango90_qa_block28
      RANGO90_ISOLATED_DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55453/rango90_qa_block28
      API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BLOCK26_ACTIVE_SEASON_START: '2026'
      BLOCK26_OUTPUT_ROOT: ${{ github.workspace }}/.block28
      BLOCK26_ACTIVE_COVERAGE_COMPLETE: 'true'
      BLOCK28_ACTIVE_SEASON_START: '2026'
      BLOCK28_HISTORICAL_START: '2011'
      BLOCK28_HISTORICAL_END: '2025'
      BLOCK28_OUTPUT_ROOT: ${{ github.workspace }}/.block28
      BLOCK28_API_REPORT_FILE: ${{ github.workspace }}/.block28/BLOCK28_API_ASSISTS_REPORT.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
      - name: Build backend before remote load
        working-directory: backend
        run: npm run build
      - name: Start temporary PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name rango90-block28-postgres -e POSTGRES_DB=rango90_qa_block28 -e POSTGRES_USER=rango90 -e POSTGRES_PASSWORD=rango90-qa -p 55453:5432 postgres:16
          for attempt in $(seq 1 40); do
            docker exec rango90-block28-postgres pg_isready -U rango90 -d rango90_qa_block28 >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rango90-block28-postgres pg_isready -U rango90 -d rango90_qa_block28
      - name: Apply migrations to isolated PostgreSQL
        working-directory: backend
        run: npm run migrate
      - name: Load existing active 2026 baseline
        if: always()
        working-directory: backend
        env:
          BLOCK27_RUN: '1'
          BLOCK26_OUTPUT_ROOT: ${{ github.workspace }}/.block28/active
          BLOCK26_ACTIVE_FACTS_FILE: ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_FACTS.json
          BLOCK27_API_REPORT_FILE: ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_REPORT.json
        run: |
          mkdir -p "$BLOCK26_OUTPUT_ROOT"
          npm run block27:fetch
          npm run block27:load
      - name: Query API-Football coverage for 2011-2025
        if: always()
        working-directory: backend
        env:
          BLOCK28_BASELINE_API_REPORT_FILE: ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_REPORT.json
        run: npx tsx src/tools/block28-api-football-assists.ts
      - name: Load first expanded historical candidate
        if: always()
        working-directory: backend
        env:
          BLOCK28_RUN: '1'
          BLOCK26_HISTORICAL_FACTS_FILE: ${{ github.workspace }}/.block28/BLOCK28_API_ASSISTS_FACTS.json
          BLOCK26_ACTIVE_FACTS_FILE: ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_FACTS.json
        run: npm run block27:load
      - name: Repeat expanded load for idempotency
        if: always()
        working-directory: backend
        env:
          BLOCK28_RUN: '1'
          BLOCK26_HISTORICAL_FACTS_FILE: ${{ github.workspace }}/.block28/BLOCK28_API_ASSISTS_FACTS.json
          BLOCK26_ACTIVE_FACTS_FILE: ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_FACTS.json
        run: npm run block27:load
      - name: Prepare isolated integration database
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55453/rango90_qa_block28_runtime
        run: |
          docker exec rango90-block28-postgres createdb -U rango90 rango90_qa_block28_runtime 2>/dev/null || true
          npm run migrate
      - name: Run backend tests and endpoint guards
        if: always()
        working-directory: backend
        env:
          RANGO90_ISOLATED_DATABASE_URL: postgresql://rango90:rango90-qa@127.0.0.1:55453/rango90_qa_block28_runtime
        run: |
          npm test
          npm run test:champions-assists
          npm run test:block26:integration
      - name: Run frontend checks
        if: always()
        run: |
          npm run lint
          npm run typecheck
          npm run verify:i18n
          npm run build
          git diff --check
      - name: Assert redaction and publication gates
        if: always()
        run: |
          set -euo pipefail
          if rg -n 'API_FOOTBALL_KEY|x-apisports-key|Authorization:|Bearer |"response"\s*:' "$BLOCK28_OUTPUT_ROOT" 2>/dev/null; then exit 1; fi
          if rg -n '"published"\s*:\s*true|"officialModeOpened"\s*:\s*true|"officialSnapshotCreated"\s*:\s*true' "$BLOCK28_OUTPUT_ROOT" 2>/dev/null; then exit 1; fi
      - name: Cleanup isolated PostgreSQL
        if: always()
        run: docker rm -f rango90-block28-postgres >/dev/null 2>&1 || true
      - name: Upload redacted Block 28 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block28-champions-assists-coverage-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/.block28/BLOCK28_REPORT.json
            ${{ github.workspace }}/.block28/BLOCK28_REPORT.md
            ${{ github.workspace }}/.block28/BLOCK28_API_ASSISTS_REPORT.json
            ${{ github.workspace }}/.block28/BLOCK28_API_ASSISTS_REPORT.md
            ${{ github.workspace }}/.block28/BLOCK28_HISTORICAL_SNAPSHOT_CANDIDATE.json
            ${{ github.workspace }}/.block28/BLOCK28_ACTIVE_SNAPSHOT_CANDIDATE.json
            ${{ github.workspace }}/.block28/BLOCK28_ACTIVE_CHANGES.json
            ${{ github.workspace }}/.block28/BLOCK28_COVERAGE_MATRIX.json
            ${{ github.workspace }}/.block28/BLOCK28_ROLLBACK.json
            ${{ github.workspace }}/.block28/BLOCK28_FACTS_AFTER.json
            ${{ github.workspace }}/.block28/active/BLOCK27_API_ASSISTS_REPORT.json
      - name: Remove temporary artifacts
        if: always()
        run: rm -rf "$BLOCK28_OUTPUT_ROOT"
