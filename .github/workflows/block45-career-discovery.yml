name: BLOQUE 45 · descubrimiento de temporadas de carrera

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run de base completa o última tanda de descubrimiento; permite reanudar desde su artefacto.'
        required: true
        type: string
      max_requests:
        description: 'Máximo 800 consultas /players/teams en esta tanda.'
        required: true
        default: '800'

permissions:
  contents: read
  actions: read

concurrency:
  group: block45-club-yellow-cards
  cancel-in-progress: false

jobs:
  career-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      BLOCK45_CAREER_SOURCE_DIR: ${{ github.workspace }}/.block45-career/source
      BLOCK45_OUTPUT_ROOT: ${{ github.workspace }}/.block45-career/output
      BLOCK45_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      BLOCK45_MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Validate discovery budget
        run: |
          set -euo pipefail
          if ! [[ "$BLOCK45_MAX_REQUESTS" =~ ^[0-9]+$ ]] || [ "$BLOCK45_MAX_REQUESTS" -lt 1 ] || [ "$BLOCK45_MAX_REQUESTS" -gt 800 ]; then
            echo 'La tanda de descubrimiento acepta entre 1 y 800 peticiones.' >&2
            exit 1
          fi
      - name: Validate source run provenance
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) throw new Error('source_run_id no es un entero válido');
            const { data } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (data.status !== 'completed' || data.conclusion !== 'success') throw new Error('El run origen debe estar completado correctamente y conservar su artefacto');
            const basePath = '.github/workflows/block45-club-yellow-cards.yml';
            const careerPath = '.github/workflows/block45-career-discovery.yml';
            if (data.path === basePath) core.setOutput('artifact-name', `block45-club-yellow-cards-${runId}`);
            else if (data.path === careerPath) core.setOutput('artifact-name', `block45-career-discovery-${runId}`);
            else throw new Error('El run origen no es un artefacto BLOQUE 45 compatible');
      - name: Download source manifest and progress
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact-name }}
          path: .block45-career/source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
      - name: Discover player career seasons without storing payloads
        working-directory: backend
        run: npx tsx src/tools/block45-discover-player-careers.ts
      - name: Run backend type build
        working-directory: backend
        run: npm run build
      - name: Redacted artifact guard
        if: always()
        run: |
          set -euo pipefail
          if rg -n 'x-apisports-key|API_FOOTBALL_KEY|secretPrinted":true|"response"\s*:' .block45-career/output; then
            echo 'Se detectó un secreto o payload crudo en los artefactos.' >&2
            exit 1
          fi
          test -f .block45-career/output/BLOCK45_CAREER_DISCOVERY_REPORT.json
      - name: Upload career discovery progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block45-career-discovery-${{ github.run_id }}
          path: .block45-career/output
          if-no-files-found: error
          retention-days: 30
