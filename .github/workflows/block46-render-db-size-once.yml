name: Block 46 one-time database size (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block46-render-db-size-once
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RANGO90_DATABASE_URL: ${{ secrets.RANGO90_DATABASE_URL }}
    steps:
      - name: Measure target database and aggregate table storage
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -z "${RANGO90_DATABASE_URL:-}" ]]; then
            echo "Required database secret is unavailable." >&2
            exit 1
          fi

          result="$(timeout 30s psql "$RANGO90_DATABASE_URL" \
            --no-psqlrc --no-password --quiet --tuples-only --no-align \
            --set=ON_ERROR_STOP=1 2>/dev/null <<'SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SELECT
            (CASE WHEN current_database() = 'rango90-db' THEN 1 ELSE 0 END)::text || E'\t' ||
            pg_database_size(current_database())::text || E'\t' ||
            COALESCE((
              SELECT SUM(pg_total_relation_size(c.oid))::bigint
              FROM pg_catalog.pg_class AS c
              JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
              WHERE c.relkind IN ('r', 'm', 'p')
                AND n.nspname <> 'information_schema'
                AND n.nspname NOT LIKE 'pg_%'
            ), 0)::text;
          COMMIT;
          SQL
          )" || {
            echo "Read-only database size query failed." >&2
            exit 1
          }

          if [[ ! "$result" =~ ^1$'\t'[0-9]+$'\t'[0-9]+$ ]]; then
            echo "Target database verification or aggregate query failed." >&2
            exit 1
          fi

          IFS=$'\t' read -r _ database_bytes table_bytes <<< "$result"
          printf 'Database size: %s bytes\n' "$database_bytes"
          printf 'Aggregate table storage (including indexes and TOAST): %s bytes\n' "$table_bytes"
