name: Rango90 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rango90
          POSTGRES_USER: rango90
          POSTGRES_PASSWORD: rango90-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rango90 -d rango90"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout contains only versioned files
        run: |
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Verify static Pages build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build:pages && npm run verify:pages

      - name: Verify static Android build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build:android && npm run verify:android

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: npm run build && npm test && npm run test:rate-limit

      - name: Prepare empty integration schema
        working-directory: backend
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          migrations=(
            migrations/001_initial.sql
            migrations/002_media_asset_kind.sql
            migrations/003_entity_external_ids.sql
            migrations/004_fact_assertion_indexes.sql
            migrations/005_source_api_type.sql
            migrations/006_entity_game_profiles.sql
            migrations/007_player_season_stats.sql
            migrations/008_entity_identity_links.sql
            migrations/009_remove_invalid_national_team_club_categories.sql
            migrations/010_repair_goalkeeper_flags.sql
            migrations/011_reject_dead_uefa_media.sql
            migrations/019_auth.sql
            migrations/026_media_rights_ledger.sql
            migrations/027_media_usage_scope.sql
            migrations/028_game_contract.sql
            migrations/053_deep_catalog_cleanup.sql
            migrations/072_freeze_published_ranking_snapshots.sql
            migrations/073_allow_approved_categories_in_game_challenges.sql
            migrations/074_validate_published_game_ranking_values.sql
            migrations/075_source_rights_ledger.sql
            migrations/076_require_https_rights_evidence.sql
          )
          for migration in "${migrations[@]}"; do
            docker exec -i "$postgres_container" psql -v ON_ERROR_STOP=1 -q -U rango90 -d rango90 < "$migration"
          done

      - name: Verify HTTP game integration
        working-directory: backend
        env:
          DATABASE_URL: postgres://rango90:rango90-ci@localhost:5432/rango90
          CORS_ORIGIN: http://localhost:3000
          AUTH_FRONTEND_ORIGIN: http://localhost:3000/es/
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  android-artifacts:
    runs-on: ubuntu-latest
    needs: web-and-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout contains only versioned files
        run: |
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and sync Capacitor assets
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release artifact is explicitly unsigned
        run: test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rango90-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rango90-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
