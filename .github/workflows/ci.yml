name: Rango90 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Verify static Pages build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build:pages && npm run verify:pages

      - name: Verify static Android build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build:android && npm run verify:android

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: npm run build && npm test && npm run test:rate-limit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  android-debug:
    runs-on: ubuntu-latest
    needs: web-and-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and sync Capacitor assets
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rango90-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
