name: Diagnose Render service (read-only)

on:
  workflow_dispatch:
    inputs:
      deploy_id:
        description: Render deploy ID to inspect
        required: true
        default: dep-dal85nnf3r2c73fbrg00
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Render service, deploy, events and logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ inputs.deploy_id }}
        run: |
          set -euo pipefail

          test -n "$RENDER_API_KEY" || {
            echo "Missing RENDER_API_KEY repository secret." >&2
            exit 1
          }
          test -n "$RENDER_SERVICE_ID" || {
            echo "Missing RENDER_SERVICE_ID repository secret." >&2
            exit 1
          }

          api_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "$1"
          }

          service="$(api_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          deploy="$(api_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")"
          deploys="$(api_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20")"
          events="$(api_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/events?limit=50")"

          owner_id="$(echo "$service" | jq -r '.ownerId // .owner.id // empty')"
          start_time="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          end_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          build_logs='{"skipped":"ownerId not exposed by service response"}'
          app_logs='{"skipped":"ownerId not exposed by service response"}'
          if [[ -n "$owner_id" ]]; then
            build_logs="$(curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              --data-urlencode "ownerId=$owner_id" \
              --data-urlencode "resource=$RENDER_SERVICE_ID" \
              --data-urlencode "startTime=$start_time" \
              --data-urlencode "endTime=$end_time" \
              --data-urlencode "direction=forward" \
              --data-urlencode "type=build" \
              --data-urlencode "limit=100" \
              https://api.render.com/v1/logs)"
            app_logs="$(curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              --data-urlencode "ownerId=$owner_id" \
              --data-urlencode "resource=$RENDER_SERVICE_ID" \
              --data-urlencode "startTime=$start_time" \
              --data-urlencode "endTime=$end_time" \
              --data-urlencode "direction=forward" \
              --data-urlencode "type=app" \
              --data-urlencode "limit=100" \
              https://api.render.com/v1/logs)"
          fi

          echo '=== SERVICE ==='
          echo "$service" | jq '{
            id, name, type, repo, branch, rootDir, autoDeploy, suspended,
            createdAt, updatedAt,
            serviceDetails: {
              buildCommand: .serviceDetails.buildCommand,
              startCommand: .serviceDetails.startCommand,
              healthCheckPath: .serviceDetails.healthCheckPath
            }
          }'

          echo '=== TARGET DEPLOY ==='
          echo "$deploy" | jq '{
            id, status, commit: (.commit // .commitId), createdAt, startedAt,
            finishedAt, trigger, serviceId, error
          }'

          echo '=== RECENT DEPLOYS ==='
          echo "$deploys" | jq 'if type == "array" then map({
            id, status, commit: (.commit // .commitId), createdAt, startedAt,
            finishedAt, trigger, serviceId, error
          }) else . end'

          echo '=== RECENT EVENTS ==='
          echo "$events" | jq .

          echo '=== BUILD LOGS ==='
          echo "$build_logs" | jq .

          echo '=== APPLICATION LOGS ==='
          echo "$app_logs" | jq .
