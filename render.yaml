services:
  - type: web
    name: rango90-api
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rango90-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://nel386.github.io
      - key: AUTH_FRONTEND_ORIGIN
        value: https://nel386.github.io/rango90/es/
      - key: AUTH_VERIFICATION_BASE_URL
        value: https://rango90-api.onrender.com/v1/auth/verify-email
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: API_FOOTBALL_KEY
        sync: false

databases:
  - name: rango90-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: rango90
    user: rango90
    diskSizeGB: 1
    storageAutoscalingEnabled: false
